<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Inicio de sesión de la billetera digital"
    />
    <title>Billetera | Iniciar sesión</title>
    <link rel="icon" href="./assets/img/logoTD/js_logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>

  <body class="app-page">
    <main class="app-shell">
      <section class="app-hero" aria-labelledby="welcome-title">
        <div>
          <img
            class="brand-logo"
            src="./assets/img/logoTD/js_logo.png"
            alt="Logo Talento Digital JS"
          />
          <h1 id="welcome-title">Mi billetera digital</h1>
          <p>Administra tus pesos chilenos de manera simple y segura.</p>
        </div>
      </section>

      <section class="app-panel" aria-labelledby="login-title">
        <p class="section-label">Acceso seguro</p>
        <h2 id="login-title">Inicia sesión</h2>
        <p class="text-secondary mb-4">
          Ingresa tus credenciales para acceder a tu cuenta.
        </p>

        <div id="alert-container" aria-live="polite"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="email">Correo electrónico</label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              placeholder="nombre@correo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="demo-card mb-3" aria-label="Credenciales de prueba">
            <strong>Acceso de prueba</strong><br />
            Correo: <code>usuario@email.com</code><br />
            Contraseña: <code>123456</code>
          </div>

          <button class="btn btn-primary w-100 py-3" type="submit">
            Iniciar sesión
          </button>
        </form>
      </section>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="./assets/js/billetera.js"></script>
    <script src="./assets/js/login.js"></script>
  </body>
</html>
