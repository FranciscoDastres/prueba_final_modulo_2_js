<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Últimos movimientos de la billetera" />
    <title>Billetera | Últimos movimientos</title>
    <link rel="icon" href="./assets/img/logoTD/js_logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>

  <body class="app-page">
    <main class="app-shell">
      <section class="app-hero" aria-labelledby="transactions-title">
        <div>
          <img
            class="brand-logo"
            src="./assets/img/logoTD/js_logo.png"
            alt="Logo Talento Digital JS"
          />
          <h1 id="transactions-title">Últimos movimientos</h1>
          <p>Revisa tus depósitos y envíos ordenados desde el más reciente.</p>
        </div>
      </section>

      <section class="app-panel" aria-labelledby="activity-title">
        <a href="menu.html" class="btn btn-outline-secondary mb-3">
          ← Volver al menú
        </a>
        <p class="section-label">Actividad</p>
        <h2 id="activity-title">Tus operaciones</h2>

        <div class="balance-card my-3">
          <span>Saldo disponible (CLP)</span>
          <strong id="saldo-transacciones">$0</strong>
        </div>

        <form id="filtro-form" class="mb-3">
          <label class="form-label" for="filtro-tipo">
            Filtrar por tipo de movimiento
          </label>
          <select id="filtro-tipo" class="form-select">
            <option value="todos" selected>Todos los movimientos</option>
            <option value="deposito">Depósito</option>
            <option value="transferencia">Transferencia enviada</option>
            <option value="transferencia-recibida">
              Transferencia recibida
            </option>
            <option value="compra">Compra</option>
          </select>
        </form>

        <div id="sin-movimientos" class="empty-state d-none">
          <strong>Aún no hay movimientos</strong>
          <span>Los depósitos y envíos aparecerán aquí.</span>
        </div>

        <ul
          id="lista-movimientos"
          class="list-group transaction-list"
          aria-label="Lista de últimos movimientos"
        ></ul>
      </section>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="./assets/js/billetera.js"></script>
    <script src="./assets/js/transactions.js"></script>
  </body>
</html>
